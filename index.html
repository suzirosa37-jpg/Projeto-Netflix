<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Selecione o perfil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header>
               <h1>Netflix</h1>
        </header>
          <p class="pergunta">Quem está a ver a netflix?</p>

        <section aria-labelledby="perfis-title" class="container">
            <h2 id="perfis-title" class="visually-hidden">Perfis</h2>

            <article class="perfil" role="button" tabindex="0" aria-label="Suzi">
                <figure>
                    <img src="./assets/perfil-1.jpeg" alt="Avatar da Suzi" />
                    <figcaption>Suzi</figcaption>
                </figure>
            </article>

            <article class="perfil" role="button" tabindex="0" aria-label="Valentim">
                <figure>
                    <img src="./assets/perfil-2.jpeg" alt="Avatar do Valentim" />
                    <figcaption>Valentim</figcaption>
                </figure>
            </article>

            <article class="perfil" role="button" tabindex="0" aria-label="Lua">
                <figure>
                    <img src="./assets/perfil-3.jpeg" alt="Avatar da Lua" />
                    <figcaption>Lua</figcaption>
                </figure>
            </article>
        </section>
    </main>

    <footer>
        <small>Selecione seu perfil para continuar.</small>
    </footer>
</body>
</html>
